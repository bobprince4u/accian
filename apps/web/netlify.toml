# Netlify configuration for the PUBLIC SITE (accian.co.uk) only.
#
# This repository is a monorepo containing three independently deployed
# applications, so each one carries its own netlify.toml. Netlify searches for
# a configuration file in this order: package directory, then base directory,
# then repository root. A file at the repository root would apply to EVERY site
# connected to this repo, which is exactly what must not happen here -- the
# public site and the admin are separate Netlify sites with different builds.
# There is therefore deliberately no netlify.toml at the repository root.
#
# REQUIRED DASHBOARD CHANGE -- this build will not run until it is made.
# Before consolidation this app was the repository root, so the site's build
# settings needed no base or package directory. The app now lives at apps/web/,
# and a Netlify site cannot discover that on its own. In the site's
# Build & deploy -> Build settings, set:
#
#     Package directory:  apps/web
#     Base directory:     (leave empty -- the repository root)
#     Build command:      npm run build:web
#     Publish directory:  apps/web/.next
#
# Base is left at the root on purpose: npm workspaces keep a single lockfile at
# the repository root, and Netlify installs dependencies from the base
# directory. Pointing base at apps/web would leave it looking for a lockfile
# that is not there. The package directory tells Netlify which app this site
# builds without moving the install away from the workspace root.
#
# The command and publish values above are also set below, which is what makes
# them reproducible from source rather than existing only in a dashboard. The
# one setting that cannot live in this file is the package directory: Netlify
# only exposes that in the UI.
[build]
  command = "npm run build:web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://api.accian.co.uk"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "http://accian.co.uk/*"
  to = "https://accian.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.accian.co.uk/*"
  to = "https://accian.co.uk/:splat"
  status = 301
  force = true

# These headers cover files served straight from the Netlify CDN. They are NOT
# the whole story, and this block used to claim otherwise.
#
# The same headers were once declared in `next.config.ts` too, and the two
# copies had drifted: different HSTS max-age values, and a `frame-src` that
# existed in only one of them. The duplicate was removed and this file was made
# the single source of truth, on the stated premise that headers here "apply
# uniformly to static assets *and* to function (SSR) responses".
#
# That premise is wrong, and production disproved it on 2026-09-25. With
# `@netlify/plugin-nextjs`, every HTML document is rendered by the Next runtime,
# and this layer decorates CDN-served files only:
#
#   curl -sI https://accian.co.uk/sitemap.xml   -> CSP present, X-Frame-Options: DENY
#   curl -sI https://accian.co.uk/              -> no CSP, no X-Frame-Options
#
# Every page on the site was serving without a CSP, including /contact and
# /pre-consultation. The HSTS on those responses was Netlify's own default
# (max-age=31536000), not the value declared below — the same value
# admin.accian.co.uk returns while declaring no headers at all, which is what
# identifies it as the platform default rather than this file.
#
# The values are therefore declared in `apps/web/config/securityHeaders.ts` and
# read from there by `next.config.ts`, which covers the documents. The copies
# below cover the CDN. `npm run guards` fails if the two disagree, so the drift
# that caused the original consolidation cannot come back silently.
#
# CHANGE BOTH OR NEITHER: edit `config/securityHeaders.ts`, then mirror it here.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Why each directive is what it is: `config/securityHeaders.ts`. The string
    # below must match the one that module builds, character for character.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.accian.co.uk; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# The `/*.html` and `/assets/*` cache rules that used to sit here were left over
# from the Vite build and matched nothing under Next.js: Next routes are
# extensionless (no `.html` at the site root) and its hashed output is served
# from `/_next/static/`, not `/assets/`. No replacement rule is added here —
# the Netlify Next.js adapter configures cache-control for `/_next/static/` and
# for rendered pages itself, and a hand-written rule would compete with it.

[[headers]]
  for = "/internal/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/internal/*"
  to = "/internal/:splat"
  status = 200
  conditions = {Role = ["admin"]}
