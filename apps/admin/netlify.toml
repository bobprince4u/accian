# Netlify configuration for the ADMIN SPA (admin.accian.co.uk) only.
#
# This file is NEW, and it is deliberately minimal: it contains the build
# settings the relocation requires, and nothing else.
#
# Before consolidation the admin repository contained no netlify.toml at all --
# its build command, publish directory and environment variables existed only
# in the Netlify dashboard, so the deployment could not be reproduced or
# reviewed from source. The values below are written to match the build this
# app has always had:
#
#     build script  "tsc -b && vite build"   (apps/admin/package.json)
#     output dir    dist                     (Vite's default; vite.config.ts
#                                             sets no build.outDir override)
#
# They are NOT a redesign of the deployment. If the dashboard currently holds
# different values, the dashboard is authoritative about what production does
# today -- reconcile before relying on this file. See docs/deployment.md.
#
# Phase 4 adds baseline security headers. CSP starts in report-only mode until
# an authenticated browser session verifies the policy on a deploy preview.
#
# This is a SEPARATE Netlify site from the public one. Both build from this
# repository but publish different directories, so they must not share a
# configuration file at the repository root -- a root netlify.toml applies to
# every site connected to the repo. There is deliberately none.
#
# REQUIRED DASHBOARD CHANGE -- this build will not run until it is made.
# The app moved from the root of its own repository to apps/admin/ in this one.
# In the site's Build & deploy -> Build settings, set:
#
#     Package directory:  apps/admin
#     Base directory:     (leave empty -- the repository root)
#     Build command:      npm run build:admin
#     Publish directory:  apps/admin/dist
#
# Base stays at the repository root because npm workspaces keep one lockfile
# there and Netlify installs dependencies from the base directory; pointing
# base at apps/admin would leave it looking for a lockfile that is not there.
# The package directory can only be set in the Netlify UI, not in this file.
[build]
  command = "npm run build:admin"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  VITE_API_URL = "https://api.accian.co.uk"

# The SPA fallback that makes client-side routing work is unchanged and still
# lives in apps/admin/public/_redirects, which Vite copies into dist/. It is
# not restated here: one source of truth per rule.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https://api.accian.co.uk; frame-ancestors 'none'; form-action 'self';"
